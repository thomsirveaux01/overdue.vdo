<!DOCTYPE html>
<html>
<head>
	<meta charset="utf8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>VDOverdue — Webcam</title>
	<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
	<link rel="icon" type="image/png" sizes="32x32" href="./media/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="./media/favicon-16x16.png">
	<link rel="icon" href="./media/favicon.ico">
	<link rel="stylesheet" href="./lineawesome/css/line-awesome.min.css">
	<link rel="stylesheet" href="./theme.css">
</head>
<body>
<script>
	(function () {
		var p = new URLSearchParams(location.search);
		var theme = "";
		try { theme = localStorage.getItem("vdoverdue.theme"); } catch (e) {}
		if (p.has("lightmode") || p.has("lighttheme")) {
			document.body.className = "lighttheme";
		} else if (p.has("whitemode") || p.has("whitetheme")) {
			document.body.className = "whitetheme";
		} else if (theme === "light") {
			document.body.className = "lighttheme";
		} else if (theme === "stygian") {
			document.body.className = "darktheme";
			document.documentElement.className = "stygian";
		} else if (theme === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
			document.body.className = "lighttheme";
		} else {
			document.body.className = "darktheme";
		}
		var hue = "";
		try { hue = localStorage.getItem("vdoverdue.hue"); } catch (e) {}
		if (hue && hue !== "blue") { document.documentElement.setAttribute("data-hue", hue); }
	})();
</script>

<!-- Landing card -->
<div id="mainmenu" class="card" style="margin-top:20px;">
	<video id="previewWebcam" muted autoplay playsinline></video>
	<div id="obsUrlBox"></div>
	<button id="getPermissions" class="btn" style="display:none" data-ready="false">
		Allow Access to Camera/Microphone
	</button>
	<button id="gowebcam" class="btn" style="display:none" disabled data-ready="false" data-audioready="false">
		Waiting for Camera to Load
	</button>
	<input id="passwordBasicInput" type="password" autocomplete="off">
	<form id="webcamquality" style="display:none">
		<input type="radio" name="resolution" value="0" checked>
	</form>
	<!-- gotDevices() looks this up directly; the stock audio-device list UI -->
	<span id="multiselect-trigger" style="display:none"></span>
	<select id="videoSourceSelect" style="display:none"></select>
	<select id="audioSource" style="display:none"></select>
	<select id="outputSource" style="display:none"></select>
</div>

<!-- Live video tile -->
<div id="gridlayout"></div>

<!-- Post-Go elements -->
<div id="mediaPanel" class="hidden2"></div>
<div id="head3" class="hidden2" style="display:none"></div>
<div id="head3a" class="hidden2" style="display:none"></div>
<a id="reshare" class="hidden2" style="display:none"></a>
<span id="copythisurl" class="hidden2" style="display:none"></span>
<div id="controlButtons" class="hidden2" style="display:none">
	<button id="mutebutton" class="btn">Mute</button>
	<button id="hangupbutton" class="btn" style="margin-left:8px">Stop</button>
</div>
<div id="head1" style="display:none"></div>
<div id="head2" style="display:none"></div>

<script src="./webrtc.js"></script>
<script>
	var session = WebRTC.Media; // must exist before lib.js parses (stock boot pattern)
	session.version = "31.2";
</script>
<script src="./lib.js"></script>
<script src="./chrome.js"></script>
<script>
(function () {
	var url = new URL(window.location.href);
	var params = url.searchParams;
	var cleanMode = params.has("cleanish") || params.has("clean");
	var viewMode = !!(params.get("V") || params.get("view") || params.get("streamid") || params.get("pull"));
	var isSpeedtest = params.has("speedtest");
	var isTransparent = params.has("transparent");
	var isFullscreen = params.has("fullscreen");
	var noAudio = params.has("noaudio");

	// Screen share redirect (landing only, not iframes)
	if (!cleanMode && (params.has("ss") || params.has("screenshare"))) {
		window.location.replace("./share.html?" + params.toString());
		return;
	}

	// Password
	if (!session.password) {
		var pw = params.get("password") || params.get("pw");
		if (pw) {
			session.password = pw;
		} else if (!viewMode && !cleanMode) {
			var bytes = new Uint8Array(16);
			crypto.getRandomValues(bytes);
			session.password = Array.from(bytes, function (b) {
				return "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[b % 62];
			}).join("");
			params.set("password", session.password);
			url.search = params.toString();
			history.replaceState(null, "", url);
		}
	}

	// Stream ID
	if (!viewMode && (!session.streamID || session.streamID === null)) {
		var pushId = params.get("push") || params.get("id") || params.get("permaid");
		if (pushId) {
			session.streamID = pushId;
		} else if (!cleanMode) {
			session.streamID = session.generateStreamID();
		}
	}

	// Quality settings (stock fields; enum 0=1080p, 1=720p, 2=360p)
	var QUALITY_MAP = { "1920x1080": 0, "1280x720": 1, "640x360": 2 };
	var defaults = { res: "1920x1080", fps: 30, kbps: 6000 };
	try {
		var saved = JSON.parse(localStorage.getItem("vdoverdue.webcam"));
		if (saved && saved.res) { defaults = saved; }
	} catch (e) {}
	session.quality = QUALITY_MAP[defaults.res] !== undefined ? QUALITY_MAP[defaults.res] : 0;
	session.maxframeRate = defaults.fps;
	session.outboundVideoBitrate = defaults.kbps;
	session.outboundVideoBitrate_userSet = true; // keep our default; stock would drop to 4000 for 1080p

	// These pages always render the local stream as a full grid tile, never the
	// stock floating "windowed" myVideo (which depends on main.css we don't load;
	// windowed true leaves a translate(0,-50%) transform on the local video).
	session.windowed = false;

	// === CLEAN/IFRAME MODE (speedtest, OBS embeds) ===
	if (cleanMode) {
		document.getElementById("mainmenu").style.display = "none";
		document.getElementById("mediaPanel").style.display = "none";
		var gl = document.getElementById("gridlayout");
		gl.style.padding = "0";
		gl.style.maxWidth = "100%";
		gl.style.margin = "0";

		if (isTransparent) { document.body.style.background = "transparent"; }
		if (isFullscreen || isTransparent) {
			var pv = document.getElementById("previewWebcam");
			pv.style.width = "100%";
			pv.style.height = "100%";
			pv.style.borderRadius = "0";
			gl.style.height = "100vh";
			gl.style.paddingBottom = "0";
		}

		session.cleanish = true;
		// stock main.js mapping; keeps the local tile in grid layout (no floating myVideo)
		session.fullscreen = params.has("fullscreen");
		if (params.has("privacy") || params.has("private") || params.has("relay")) {
			session.privacy = params.get("privacy") || true;
		}

		// URL quality/fps/bitrate overrides (stock main.js mappings; the speedtest page
		// forwards only canonical names — it resolves the aliases itself).
		function parseQualityParam(raw) {
			// stock named-value mapping (main.js quality / screensharequality)
			var v = String(raw).toLowerCase();
			if (v == "4k" || v == "2160p" || v == "2160") { return -2; }
			if (v == "2k" || v == "1440p" || v == "1440") { return -3; }
			if (v == "hd" || v == "720p" || v == "720") { return 1; }
			if (v == "fullhd" || v == "1080p" || v == "1080" || v == "high") { return 0; }
			if (v == "360p" || v == "360" || v == "low") { return 2; }
			return parseInt(raw) || 0;
		}
		if (params.has("quality")) {
			session.quality = parseQualityParam(params.get("quality"));
		}
		if (params.has("width") || params.has("w")) {
			session.width = parseInt(params.get("width") || params.get("w"));
		}
		if (params.has("height") || params.has("h")) {
			session.height = parseInt(params.get("height") || params.get("h"));
		}
		if (params.has("frameRate") || params.has("fr") || params.has("fps")) {
			session.frameRate = parseInt(params.get("frameRate") || params.get("fr") || params.get("fps"));
		}
		if (params.has("maxframerate") || params.has("mfr") || params.has("mfps")) {
			session.maxframeRate = parseInt(params.get("maxframerate") || params.get("mfr") || params.get("mfps"));
		}
		if (params.has("screensharefps") || params.has("ssfps")) {
			session.screensharefps = parseInt(params.get("screensharefps") || params.get("ssfps")) || 2;
		}
		if (params.has("screensharequality") || params.has("ssq")) {
			session.screensharequality = parseQualityParam(params.get("screensharequality") || params.get("ssq"));
		}
		if (params.has("videobitrate") || params.has("bitrate") || params.has("vb")) {
			session.bitrate = parseInt(params.get("videobitrate") || params.get("bitrate") || params.get("vb")) || 8000;
		}
		if (params.has("outboundvideobitrate") || params.has("outboundbitrate") || params.has("ovb")) {
			session.outboundVideoBitrate = parseInt(params.get("outboundvideobitrate") || params.get("outboundbitrate") || params.get("ovb")) || false;
			session.outboundVideoBitrate_userSet = true;
		}
		if (params.has("maxvideobitrate") || params.has("maxbitrate") || params.has("maxvb") || params.has("mvb")) {
			session.maxvideobitrate = parseInt(params.get("maxvideobitrate") || params.get("maxbitrate") || params.get("maxvb") || params.get("mvb"));
			if (session.maxvideobitrate < 1) {
				session.maxvideobitrate = false;
			}
		}

		if (isSpeedtest) {
			session.speedtest = params.get("speedtest") || true;
			setupSpeedtest();
			// stock speedtest throttle: max 6000 kbps
			if (session.maxvideobitrate === false || session.maxvideobitrate > 6000) {
				session.maxvideobitrate = 6000;
			}
		}
		// Speedtest: stats + control via postMessage from the speedtest page.
		// The stock getStats responder lives in main.js:9722 (not loaded by these
		// pages); getQuickStats() is stock lib.js, and the stock speedtest page
		// consumes stats.inbound[streamID][trackID] objects — the viewer iframe
		// supplies the real inbound metrics, the publisher the outbound stats.
		if (isSpeedtest) {
			window.addEventListener("message", function (e) {
				if (!e.data) return;
				if (e.data.getStats === true) {
					parent.postMessage(
						{ stats: e.data.streamID ? getQuickStats(e.data.streamID) : getQuickStats(), cib: e.data.cib || null },
						session.iframetarget
					);
				}
				if (typeof e.data.bitrate === "number") {
					// Stock seeder-side path: limitBitrate() per peer connection — the same
					// function the stock signaling handler (webrtc.js:13191) and the seeder
					// debug menu use. Sets the encoder maxBitrate directly, honors the
					// maxvideobitrate cap, and negative value restores the default target
					// (stock "Default Bitrate" button sends -1). Also fires the stock
					// setVideoBitrate poke, which drives the page's log line + button state.
					for (var uid in session.pcs) {
						session.limitBitrate(uid, e.data.bitrate);
					}
				}
				if (e.data.close === true) {
					session.hangup();
				}
			});
		}

		if (viewMode) {
			var sid = params.get("V") || params.get("view") || params.get("streamID") || params.get("streamid") || params.get("pull");
			session.view = sid;
			session.cleanOutput = true;
			if (noAudio) { session.noaudio = []; }
			session.watchStream(sid);
		} else {
			// Auto-publish.
			// Webcam: stock entry point — previewWebcam() requests permissions, runs
			// setupWebcamSelection -> grabVideo for the preview, and because
			// session.autostart is set, publishWebcam() fires when the preview is ready.
			// Screenshare: the stock autostart path (main.js) calls publishScreen()
			// 50ms after startup when session.screenshare is set.
			session.cleanOutput = true;
			session.webcamonly = params.has("webcam");
			session.remote = params.has("remote");
			session.autostart = true;
			if (noAudio || params.get("audiodevice") === "0") {
				session.audioDevice = 0; // no microphone in the test feed
			}
			if (params.has("screenshare") || params.has("ss")) {
				session.screenshare = true;
				setTimeout(function () { publishScreen(); }, 50);
			} else {
				previewWebcam(false);
			}
		}

		return;
	}

	// === LANDING MODE ===
	chromeInit(viewMode ? false : "navWebcam");
	document.getElementById("passwordBasicInput").placeholder = "Stream password";

	// View mode (user opened ?V= directly, not in an iframe)
	if (viewMode) {
		var streamID = params.get("V") || params.get("view") || params.get("streamID") || params.get("streamid") || params.get("pull");
		session.view = streamID;
		session.cleanOutput = true;
		document.getElementById("mainmenu").style.display = "none";
		var vid = document.getElementById("previewWebcam");
		vid.style.display = "block";
		vid.style.width = "100%";
		vid.style.height = "auto";
		vid.style.borderRadius = "0";
		var nav = document.getElementById("appNavBar");
		var top = document.getElementById("appTopBar");
		var foot = document.getElementById("appFooter");
		if (nav) nav.style.display = "none";
		if (top) top.style.display = "none";
		if (foot) foot.style.display = "none";
		session.watchStream(streamID);
		return;
	}

	// Publish mode: build OBS URL box
	var obsStreamID = params.get("push") || params.get("id") || params.get("permaid") || session.streamID;
	var obsURL = location.origin + location.pathname + "?V=" + obsStreamID + "&password=" + encodeURIComponent(session.password);
	var obsBox = document.getElementById("obsUrlBox");
	var obsInput = document.createElement("input");
	obsInput.type = "text";
	obsInput.value = obsURL;
	obsInput.readOnly = true;
	obsBox.appendChild(obsInput);
	var obsCopy = document.createElement("button");
	obsCopy.className = "btn";
	obsCopy.textContent = "Copy";
	obsCopy.onclick = function () {
		obsInput.select();
		document.execCommand("copy");
		obsCopy.textContent = "Copied!";
		setTimeout(function () { obsCopy.textContent = "Copy"; }, 1500);
	};
	obsBox.appendChild(obsCopy);

	// Build media panel
	var panel = document.getElementById("mediaPanel");
	panel.innerHTML =
		'<div id="mediaPanelHead">Stream settings</div>' +
		'<div id="mediaPanelControls">' +
		'<div class="mediaField"><span>Resolution</span>' +
		'<select id="mediaResSelect">' +
		'<option value="1920x1080"' + (defaults.res === "1920x1080" ? " selected" : "") + '>1080p</option>' +
		'<option value="1280x720"' + (defaults.res === "1280x720" ? " selected" : "") + '>720p</option>' +
		'<option value="640x360"' + (defaults.res === "640x360" ? " selected" : "") + '>360p</option>' +
		'</select></div>' +
		'<div class="mediaField"><span>Framerate</span>' +
		'<select id="mediaFpsSelect">' +
		'<option value="30"' + (String(defaults.fps) === "30" ? " selected" : "") + '>30</option>' +
		'<option value="60"' + (String(defaults.fps) === "60" ? " selected" : "") + '>60</option>' +
		'<option value="24"' + (String(defaults.fps) === "24" ? " selected" : "") + '>24</option>' +
		'</select></div>' +
		'<div class="mediaField"><span>Bitrate</span>' +
		'<input type="number" id="mediaBitrateInput" min="500" max="20000" step="100" value="' + defaults.kbps + '"></div>' +
		'<button id="mediaApplyButton" class="btn">Apply</button>' +
		'</div>' +
		'<div id="mediaPanelStatus">' +
		'<div class="mediaStatRow"><span class="mediaStatLabel">Target</span><span id="mediaTargetLine">\u2014</span></div>' +
		'<div class="mediaStatRow"><span class="mediaStatLabel">Now</span><span id="mediaActualLine">\u2014</span></div>' +
		'<div class="mediaStatRow"><span class="mediaStatLabel">Encoder</span><span id="mediaEncoderLine">\u2014</span></div>' +
		'<div id="mediaLimitHint" style="display:none"></div>' +
		'</div>';

	panel.classList.remove("hidden2");
	panel.style.display = "block";

	// Apply
	document.getElementById("mediaApplyButton").onclick = function () {
		var res = document.getElementById("mediaResSelect").value;
		session.quality = QUALITY_MAP[res] !== undefined ? QUALITY_MAP[res] : 0;
		session.maxframeRate = parseInt(document.getElementById("mediaFpsSelect").value, 10);
		session.outboundVideoBitrate = parseInt(document.getElementById("mediaBitrateInput").value, 10);
		session.outboundVideoBitrate_userSet = true;
		localStorage.setItem("vdoverdue.webcam", JSON.stringify({
			res: res, fps: session.maxframeRate, kbps: session.outboundVideoBitrate
		}));
		// Re-grab the preview with the new resolution/framerate (stock guards
		// the first grab; device-change handlers always reset it first). The
		// bitrate field is read live by the bandwidth estimator for peers.
		activatedPreview = false;
		grabVideo(session.quality);
	};

	// Start camera — stock flow: previewWebcam() requests permissions, runs
	// setupWebcamSelection -> grabVideo for the live preview, and enables the
	// Go button (disabled=false, dataset.ready) when the preview is ready.
	previewWebcam(false);

	// Go
	document.getElementById("gowebcam").onclick = function () { publishWebcam(this); };

	// Status
	setInterval(function () {
		var t = document.getElementById("mediaTargetLine");
		var a = document.getElementById("mediaActualLine");
		var e2 = document.getElementById("mediaEncoderLine");
		var l = document.getElementById("mediaLimitHint");
		if (!t) return;
		t.textContent = (document.getElementById("mediaResSelect").value || "\u2014") + " \u00B7 " +
			(session.maxframeRate || "\u2014") + " fps \u00B7 " + (session.outboundVideoBitrate || "\u2014") + " kbps";
		// we are the seeder; peers (viewers) live in session.pcs
		if (session.pcs) {
			for (var uid in session.pcs) {
				var peer = session.pcs[uid];
				if (peer && peer.stats && peer.stats.video_bitrate_kbps !== undefined) {
					a.textContent = (peer.stats.video_bitrate_kbps || 0) + " kbps";
					e2.textContent = peer.stats.video_encoder || "\u2014";
					var lim = peer.stats.quality_limitation_reason;
					if (lim && lim !== "none") { l.style.display = ""; l.textContent = "Limited: " + lim; }
					else { l.style.display = "none"; }
					break;
				}
			}
		}
	}, 1000);

	// Stop + Mute
	document.getElementById("hangupbutton").onclick = function () { session.hangup(); };
	document.getElementById("mutebutton").onclick = function () { toggleMute(); };
})();
</script>
</body>
</html>
